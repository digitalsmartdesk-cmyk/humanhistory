<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,600;0,650;0,700;1,600;1,650&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0}a:hover{opacity:.7}</style>
</helmet>
<sc-if value="{{dataReady}}" hint-placeholder-val="{{false}}">
  <dc-import name="ChapterBody" data="{{data}}" meta="{{meta}}" hint-size="100%,2400px" style="display:block"></dc-import>
</sc-if>
<sc-if value="{{loading}}" hint-placeholder-val="{{true}}">
  <div style="min-height:100vh;background:oklch(97.8% 0.007 75);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;color:oklch(60% 0.013 55);font-size:13px">Loading chapter…</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null };
  componentDidMount() {
    fetch('../data/14-mind-and-wellbeing.json').then(r => r.json()).then(d => this.setState({ data: d }));
  }
  renderVals() {
    const meta = {
      partColor: 'oklch(48% 0.14 305)', partColorText: 'oklch(38% 0.12 305)',
      partLabel: 'Part 5 · How people live', overviewHref: './00-overview.dc.html',
      prev: { href: './13-literacy-wisdom-knowledge.dc.html', label: 'Chapter 13 · Literacy, wisdom and knowledge' },
      next: { href: './15-power-and-governance.dc.html', label: 'Chapter 15 · Power and governance' }
    };
    return { dataReady: !!this.state.data, loading: !this.state.data, data: this.state.data || {}, meta };
  }
}
</script>
</body>
</html>
